[project]
name = "fadia-backend"
version = "0.1.0"
description = "Backend for the FaDia industrial fault diagnosis agent."
requires-python = ">=3.10"
dependencies = [
    # Web
    "fastapi>=0.116.0",
    "uvicorn>=0.35.0",
    "python-multipart>=0.0.20",
    "httpx>=0.28.1",
    # Database
    "sqlalchemy>=2.0.51",
    "asyncpg>=0.31.0,<1.0.0",
    "greenlet>=3.5.3",
    "alembic>=1.18.5",
    "pgvector>=0.5.0",
    # LLM / Agent
    "langchain>=1.3.12",
    "langchain-openai>=1.3.3",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.8",
    # Document ingestion
    "pymupdf>=1.26.0",
    "boto3>=1.43.0",
    # Retrieval
    "rank-bm25>=0.2.2",
    # Auth
    "pwdlib[argon2]>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "pyright>=1.1.400",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
