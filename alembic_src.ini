# Alembic config for apps/backend/src (the current target project).
#
# Three configs live side by side:
#   alembic.ini            -- legacy (src2 era)
#   alembic.postgresql.ini -- src1's (its env.py imports `fault_diagnosis`, unusable here)
#   alembic_src.ini        -- this one, serves apps.backend.src only
#
# NOTE: keep this file ASCII-only. configparser reads it with the locale
# encoding (GBK on this machine), so non-ASCII comments blow up with
# UnicodeDecodeError before Alembic even starts.
#
# Run from the repo root:
#     python -m alembic -c apps/backend/alembic_src.ini upgrade head
#
# The connection URL is not set here -- env.py reads it from
# config/project.json (same source as the running app).

[alembic]
# Relative to the directory Alembic is RUN FROM (the repo root here), not to
# this ini file -- so it needs the full path.
script_location = alembic_src
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
